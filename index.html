<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Terminal</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
        }

        #header {
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffcc;
        }

        /* The retro CRT monitor box */
        #screen_container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 15px solid #222;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 255, 204, 0.2), inset 0px 0px 20px rgba(0,0,0,1);
            background-color: #000;
            overflow: hidden;
        }

        #game_window {
            width: 100%;
            height: 100%;
        }

        /* Scanlines overlay */
        #screen_container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Arcade System // Ready</h1>
        <p>Select a ROM file or host a game file in your repository.</p>
    </div>

    <div id="screen_container">
        <div id="game_window"></div>
    </div>

    <script>
        // Set your target system (e.g., 'snes', 'gba', 'nes', 'segaMD', 'n64')
        EJS_player = "#game_window";
        EJS_core = "snes"; 
        EJS_gameUrl = "your_game_rom.sfc"; // Path to your game ROM file
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
