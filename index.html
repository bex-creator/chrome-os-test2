<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Terminal</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
        }

        #header {
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ffcc;
        }

        h1 { margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #00b38f; margin-bottom: 15px; font-size: 14px; }

        #setup_panel {
            background-color: #121212;
            border: 1px solid #00ffcc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        select, button {
            background-color: #002b22;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        button {
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 10px #00ffcc44;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }

        /* Stylized CRT Monitor */
        #screen_container {
            position: relative;
            width: 800px;
            height: 600px;
            max-width: 90vw;
            max-height: 70vh;
            border: 15px solid #222;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 255, 204, 0.2), inset 0px 0px 20px rgba(0,0,0,1);
            background-color: #000;
            overflow: hidden;
            display: none;
        }

        #game_window {
            width: 100%;
            height: 100%;
        }

        /* Scanlines Overlay */
        #screen_container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Arcade Terminal</h1>
        <p>Select a pre-loaded arcade game to stream instantly.</p>
    </div>

    <div id="setup_panel">
        <div>
            <label for="game_select">Select Game: </label>
            <select id="game_select">
                <option value="https://raw.githubusercontent.com/gbadev-org/2048-GBA/master/2048.gba" data-core="gba">2048 (GBA)</option>
                <option value="https://raw.githubusercontent.com/gbdev/homebrewhub/main/db-sources/database-gb/entries/tobu_tobu_girl/tobu_tobu_girl.gb" data-core="gb">Tobu Tobu Girl (Game Boy)</option>
            </select>
        </div>

        <button id="btn_launch">Launch Game</button>
    </div>

    <div id="screen_container">
        <div id="game_window"></div>
    </div>

    <script>
        document.getElementById("btn_launch").addEventListener("click", function() {
            var selectMenu = document.getElementById("game_select");
            var selectedOption = selectMenu.options[selectMenu.selectedIndex];

            var gameUrl = selectedOption.value;
            var selectedCore = selectedOption.getAttribute("data-core");

            // Hide the setup menu and reveal the CRT display
            document.getElementById("setup_panel").style.display = "none";
            document.getElementById("screen_container").style.display = "block";

            // Configure EmulatorJS to fetch the game from the web URL
            window.EJS_player = "#game_window";
            window.EJS_core = selectedCore;
            window.EJS_gameUrl = gameUrl;
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

            // Inject the emulator loader script
            var loader = document.createElement("script");
            loader.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(loader);
        });
    </script>
</body>
</html>
