<!DOCTYPE html>
<html style="height: 100%; margin: 0; background: #000;">
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <script src="libv86.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }

        #screen_container {
            width: 100vw;
            height: 100vh;
        }

        /* Styling for v86 text terminal mode */
        #screen_container div {
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            color: #ffffff;
            background-color: #000000;
        }

        /* Forces v86 VGA graphical canvas to unhide and fill window */
        #screen_container canvas {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- v86 automatically populates this container -->
    <div id="screen_container"></div>

    <script>
        window.onload = function() {
            var V86Class = window.V86 || window.V86Starter;

            if (!V86Class) {
                alert("libv86.js failed to load.");
                return;
            }

            function getAbsUrl(filename) {
                return new URL(filename, location.href).href;
            }

            var emulator = window.emulator = new V86Class({
                wasm_path: getAbsUrl("v86.wasm"),
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: getAbsUrl("seabios.bin") },
                vga_bios: { url: getAbsUrl("vgabios.bin") },
                cdrom: { url: getAbsUrl("linux4.iso") },
                autostart: true
            });
        };
    </script>
</body>
</html>
