<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <link rel="icon" href="data:,">
    
    <!-- Load matching v86 runtime -->
    <script src="https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            overflow: auto;
            padding: 20px 0;
        }

        #status_bar {
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ff66;
            text-align: center;
            max-width: 640px;
            word-break: break-all;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 4px;
        }

        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* Serial Console Terminal Output */
        #serial_container {
            width: 648px;
            height: 200px;
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
            border: 2px solid #333333;
            padding: 8px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="status_bar">Initializing emulator environment...</div>

    <!-- VGA Screen -->
    <div id="screen_wrapper">
        <div id="screen_container"></div>
    </div>

    <!-- Serial Terminal Output -->
    <div id="serial_container"></div>

    <script>
        const statusBar = document.getElementById("status_bar");

        function logStatus(msg, isError = false) {
            statusBar.style.color = isError ? "#ff4444" : "#00ff66";
            statusBar.textContent = msg;
        }

        window.onerror = function(msg) {
            logStatus("JS Error: " + msg, true);
        };

        window.onload = function() {
            var V86Class = window.V86Starter || window.V86;
            if (!V86Class) {
                logStatus("Error: libv86.js failed to load.", true);
                return;
            }

            logStatus("Booting Linux ISO...");

            var emulator = window.emulator = new V86Class({
                wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                memory_size: 512 * 1024 * 1024, // 512 MB RAM required for Linux kernel boot
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                serial_container: document.getElementById("serial_container"),
                bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin" },
                vga_bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin" },
                cdrom: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/images/linux4.iso" },
                autostart: true
            });

            emulator.add_listener("emulator-ready", function() {
                logStatus("Emulator active. Linux is booting into the terminal below...");
            });
        };
    </script>
</body>
</html>
