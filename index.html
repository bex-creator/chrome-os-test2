<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <link rel="icon" href="data:,">
    
    <!-- Matched v86 Library Bundle from CDN -->
    <script src="https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            padding: 20px 0;
        }

        #status_bar {
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ff66;
            text-align: center;
            width: 648px;
            max-width: 90%;
            word-break: break-all;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 4px;
        }

        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
        }

        #terminal {
            width: 648px;
            max-width: 90%;
            height: 250px;
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            font-size: 13px;
            line-height: 16px;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
            border: 2px solid #333333;
            padding: 10px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="status_bar">Initializing Linux VM...</div>

    <!-- VGA Display Container -->
    <div id="screen_wrapper">
        <div id="screen_container"></div>
    </div>

    <!-- Serial Terminal Container -->
    <div id="terminal"></div>

    <script>
        const statusBar = document.getElementById("status_bar");

        function logStatus(msg, isError = false) {
            statusBar.style.color = isError ? "#ff4444" : "#00ff66";
            statusBar.textContent = msg;
        }

        // Catch runtime errors and output to status bar
        window.onerror = function(msg) {
            logStatus("Script Error: " + msg, true);
        };

        // Fetch binary files into memory and verify they aren't Git LFS text pointers
        async function fetchVerifiedBinary(url) {
            logStatus("Downloading " + url.split("/").pop() + "...");
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status + " fetching " + url);
            const buf = await res.arrayBuffer();

            // Detect if a file is an LFS text pointer instead of a real binary
            if (buf.byteLength < 1000) {
                const text = new TextDecoder().decode(buf);
                if (text.includes("git-lfs")) {
                    throw new Error(url + " is a Git LFS text pointer, not a valid binary file.");
                }
            }
            return buf;
        }

        window.onload = async function() {
            var V86Class = window.V86Starter || window.V86;
            if (!V86Class) {
                logStatus("Error: v86 library failed to load from CDN. Check adblockers/network.", true);
                return;
            }

            try {
                // Pre-fetch working BIOS and Linux Kernel binaries directly from CDN into RAM
                const [biosBuf, vgaBiosBuf, kernelBuf] = await Promise.all([
                    fetchVerifiedBinary("https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin"),
                    fetchVerifiedBinary("https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin"),
                    fetchVerifiedBinary("https://k.copy.sh/buildroot-bzimage.bin")
                ]);

                logStatus("Booting Linux Kernel via WASM...");

                var emulator = window.emulator = new V86Class({
                    wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                    memory_size: 128 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    screen_container: document.getElementById("screen_container"),
                    serial_container: document.getElementById("terminal"),
                    bios: { buffer: biosBuf },
                    vga_bios: { buffer: vgaBiosBuf },
                    bzimage: { buffer: kernelBuf },
                    cmdline: "console=ttyS0 quiet",
                    autostart: true
                });

                emulator.add_listener("emulator-ready", function() {
                    logStatus("Linux Booted Successfully! Type commands in the terminal below.");
                });

            } catch (err) {
                logStatus("Boot Failure: " + err.message, true);
            }
        };
    </script>
</body>
</html>
