<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Desktop OS</title>
    <!-- Load the local script you uploaded -->
    <script src="libv86.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        #screen_container {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.7);
            background-color: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            /* Hides the real cursor when hovering over the screen */
            cursor: none; 
        }
    </style>
</head>
<body>

    <h1>WebAssembly Desktop OS</h1>
    <p>Click inside the window to lock the mouse. Press <b>Esc</b> to release it.</p>

    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace;"></div>
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            // Initialize the emulator using your local files
            var emulator = new window.V86({
                wasm_path: "v86.wasm",
                memory_size: 512 * 1024 * 1024,     // Increased RAM to 512MB for ReactOS
                vga_memory_size: 8 * 1024 * 1024,   
                screen_container: document.getElementById("screen_container"),
                bios: {
                    url: "seabios.bin",
                },
                vga_bios: {
                    url: "vgabios.bin",
                },
                // Swapped from fda (floppy) to hda (hard drive) for ReactOS
                hda: {
                    url: "reactos.img",
                },
                autostart: true,
            });

            // Lock the mouse to the canvas when clicked to fix the double cursor
            var canvas = document.querySelector("canvas");
            canvas.addEventListener("click", async function() {
                // Only request lock if it isn't already locked
                if (document.pointerLockElement !== canvas) {
                    await canvas.requestPointerLock();
                }
            });
        };
    </script>
</body>
</html>
