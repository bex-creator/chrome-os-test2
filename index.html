<!DOCTYPE html>
<html style="height: 100%; margin: 0; background-color: #000;">
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <style>
        /* Forces text-mode terminal output to render white text on black background */
        #screen_container {
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            background-color: #000000;
            color: #ffffff; /* Prevents text from being invisible */
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
    <script src="libv86.js"></script>
</head>
<body style="height: 100%; margin: 0; background: #000; overflow: hidden;">

    <!-- Required dual DOM layout for v86 (div for text mode, canvas for VGA mode) -->
    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace;"></div>
        <canvas style="display: none;"></canvas>
    </div>

    <script>
        window.onload = function() {
            var V86Constructor = window.V86 || window.V86Starter;

            if (!V86Constructor) {
                alert("V86 engine failed to attach to window.");
                return;
            }

            var emulator = window.emulator = new V86Constructor({
                wasm_path: "v86.wasm",
                memory_size: 128 * 1024 * 1024,      // 128 MB RAM for OS boot
                vga_memory_size: 8 * 1024 * 1024,    // 8 MB VGA RAM
                screen_container: document.getElementById("screen_container"),
                bios: { url: "seabios.bin" },
                vga_bios: { url: "vgabios.bin" },
                cdrom: { url: "linux4.iso" },
                autostart: true
            });
        };
    </script>
</body>
</html>
