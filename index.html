<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <!-- Prevent 404 favicon warning -->
    <link rel="icon" href="data:,">
    
    <script src="libv86.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        #screen_container {
            background-color: #000000;
            min-height: 100vh;
            padding: 8px;
            box-sizing: border-box;
        }

        /* Essential text-mode character styling for v86 */
        #screen_container div {
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            color: #ffffff !important;
            background-color: #000000 !important;
        }

        /* Default styling for spans generated by v86 text mode */
        #screen_container div span {
            background-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Strict DOM structure required by v86 ScreenAdapter -->
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <script>
        window.onload = function() {
            var V86Class = window.V86 || window.V86Starter;

            if (!V86Class) {
                console.error("libv86.js failed to load.");
                return;
            }

            // Convert relative filenames into absolute URLs for Web Workers
            function getAbsUrl(filename) {
                return new URL(filename, location.href).href;
            }

            var emulator = window.emulator = new V86Class({
                wasm_path: getAbsUrl("v86.wasm"),
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: getAbsUrl("seabios.bin") },
                vga_bios: { url: getAbsUrl("vgabios.bin") },
                cdrom: { url: getAbsUrl("linux4.iso") },
                autostart: true
            });
        };
    </script>
</body>
</html>
