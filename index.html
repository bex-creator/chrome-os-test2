<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <link rel="icon" href="data:,">
    
    <!-- v86 Runtime -->
    <script src="libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            padding: 20px 0;
        }

        #status_bar {
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ff66;
            text-align: center;
            max-width: 648px;
            width: 90%;
            word-break: break-all;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 4px;
        }

        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
        }

        #terminal_output {
            width: 648px;
            max-width: 90%;
            height: 220px;
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            font-size: 13px;
            line-height: 16px;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
            border: 2px solid #333333;
            padding: 10px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="status_bar">Initializing environment...</div>

    <!-- Graphical Screen Container -->
    <div id="screen_wrapper">
        <div id="screen_container"></div>
    </div>

    <!-- Serial Console Output Terminal -->
    <div id="terminal_output"></div>

    <script>
        const statusBar = document.getElementById("status_bar");
        const terminal = document.getElementById("terminal_output");

        function logStatus(msg, isError = false) {
            statusBar.style.color = isError ? "#ff4444" : "#00ff66";
            statusBar.textContent = msg;
        }

        // Fetch binary files directly into memory buffers to avoid HTTP Range Request stalls
        async function loadBinary(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("Failed to load " + url + " (HTTP " + res.status + ")");
            return await res.arrayBuffer();
        }

        window.onload = async function() {
            var V86Class = window.V86Starter || window.V86;
            if (!V86Class) {
                logStatus("Error: libv86.js failed to load.", true);
                return;
            }

            try {
                logStatus("Downloading BIOS and Linux ISO into RAM...");
                
                const [biosBuf, vgaBiosBuf, isoBuf] = await Promise.all([
                    loadBinary("seabios.bin"),
                    loadBinary("vgabios.bin"),
                    loadBinary("linux4.iso")
                ]);

                logStatus("Launching WASM Virtual Machine...");

                var emulator = window.emulator = new V86Class({
                    wasm_path: "v86.wasm",
                    memory_size: 128 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    screen_container: document.getElementById("screen_container"),
                    bios: { buffer: biosBuf },
                    vga_bios: { buffer: vgaBiosBuf },
                    cdrom: { buffer: isoBuf },
                    autostart: true
                });

                emulator.add_listener("emulator-ready", function() {
                    logStatus("VM Active. Linux Kernel Booting...");
                });

                // Capture character stream directly from serial ttyS0
                emulator.add_listener("serial0-output-char", function(char) {
                    terminal.textContent += char;
                    terminal.scrollTop = terminal.scrollHeight;
                });

            } catch (err) {
                logStatus("Boot Failure: " + err.message, true);
            }
        };
    </script>
</body>
</html>
