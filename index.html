<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <!-- Prevent 404 favicon warning -->
    <link rel="icon" href="data:,">
    <script src="libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
        }

        /* Centered emulator view container */
        #screen_container {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            min-width: 640px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* v86 Text Mode styling */
        #screen_container > div {
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            color: #ffffff;
            background-color: #000000;
        }

        /* v86 VGA Graphics Mode canvas scaling */
        #screen_container > canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <!-- Minimal DOM structure required by v86 ScreenAdapter -->
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <script>
        window.onload = function() {
            var V86Class = window.V86 || window.V86Starter;

            if (!V86Class) {
                console.error("libv86.js failed to load.");
                return;
            }

            function getAbsUrl(filename) {
                return new URL(filename, location.href).href;
            }

            var emulator = window.emulator = new V86Class({
                wasm_path: getAbsUrl("v86.wasm"),
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: getAbsUrl("seabios.bin") },
                vga_bios: { url: getAbsUrl("vgabios.bin") },
                cdrom: { url: getAbsUrl("linux4.iso") },
                autostart: true
            });
        };
    </script>
</body>
</html>
