<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Web OS</title>
    <link rel="icon" href="data:,">
    
    <!-- Load v86 library bundle -->
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
        }

        #status_bar {
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ff66;
            text-align: center;
            width: 648px;
            max-width: 90%;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            padding: 4px;
        }

        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div id="status_bar">Loading OS into memory...</div>

    <div id="screen_wrapper">
        <div id="screen_container"></div>
    </div>

    <script>
        const statusBar = document.getElementById("status_bar");

        function logStatus(msg, isError = false) {
            statusBar.style.color = isError ? "#ff4444" : "#00ff66";
            statusBar.textContent = msg;
        }

        window.onerror = function(msg) {
            logStatus("Error: " + msg, true);
        };

        window.onload = function() {
            var V86Class = window.V86Starter || window.V86;
            if (!V86Class) {
                logStatus("Error: Could not load v86 from CDN. Check adblockers.", true);
                return;
            }

            try {
                logStatus("Booting OS from GitHub mirror...");

                var emulator = window.emulator = new V86Class({
                    wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                    memory_size: 64 * 1024 * 1024,
                    vga_memory_size: 2 * 1024 * 1024,
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin" },
                    vga_bios: { url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin" },
                    fda: { url: "https://cdn.jsdelivr.net/gh/copy/images@master/freedos722.img" },
                    autostart: true
                });

                emulator.add_listener("emulator-ready", function() {
                    logStatus("OS Booted! Click inside the screen to interact.");
                });

            } catch (err) {
                logStatus("Boot Error: " + err.message, true);
            }
        };
    </script>
</body>
</html>
