<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <link rel="icon" href="data:,">
    
    <!-- Load v86 runtime from jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            overflow: hidden;
        }

        /* Status header */
        #status_bar {
            margin-bottom: 12px;
            font-size: 14px;
            color: #00ff66;
            text-align: center;
        }

        /* Screen Wrapper */
        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 4px;
        }

        /* v86 target container - Keep standard block layout for v86 internal scaling */
        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        #screen_container > div {
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            color: #ffffff;
            background-color: #000000;
        }

        #screen_container > canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <div id="status_bar">Initializing emulator environment...</div>

    <div id="screen_wrapper">
        <div id="screen_container">
            <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
            <canvas style="display: none"></canvas>
        </div>
    </div>

    <script>
        window.onload = async function() {
            var statusBar = document.getElementById("status_bar");
            var V86Class = window.V86Starter || window.V86;

            if (!V86Class) {
                statusBar.style.color = "#ff4444";
                statusBar.textContent = "Error: libv86.js failed to load from CDN.";
                return;
            }

            function getAbsUrl(filename) {
                return new URL(filename, location.href).href;
            }

            const isoUrl = getAbsUrl("linux4.iso");

            // Verify linux4.iso actually exists on GitHub Pages before booting
            statusBar.textContent = "Checking for linux4.iso...";
            try {
                const response = await fetch(isoUrl, { method: "HEAD" });
                if (!response.ok) {
                    statusBar.style.color = "#ff4444";
                    statusBar.textContent = "Error: linux4.iso not found (404). Upload linux4.iso to your GitHub repo root.";
                    return;
                }
            } catch (err) {
                statusBar.style.color = "#ff4444";
                statusBar.textContent = "Error verifying linux4.iso location.";
                return;
            }

            statusBar.textContent = "Loading WebAssembly CPU & Linux ISO...";

            var emulator = window.emulator = new V86Class({
                wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin" },
                vga_bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin" },
                cdrom: { url: isoUrl },
                autostart: true
            });

            emulator.add_listener("emulator-ready", function() {
                statusBar.textContent = "Emulator Running - Booting Linux...";
            });
        };
    </script>
</body>
</html>
