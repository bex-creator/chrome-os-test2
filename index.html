<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <!-- Prevent 404 favicon log -->
    <link rel="icon" href="data:,">
    
    <script src="libv86.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #111111;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            overflow: hidden;
        }

        #screen_container {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 12px;
            display: inline-block;
        }

        /* Force all child spans and text nodes inside v86 container to render white text */
        #screen_container div,
        #screen_container div * {
            white-space: pre !important;
            font-family: monospace !important;
            font-size: 16px !important;
            line-height: 16px !important;
            color: #ffffff !important;
            background-color: #000000 !important;
        }

        #screen_container canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div id="screen_container">
        <div style="white-space: pre; font: 16px monospace; line-height: 16px;"></div>
        <canvas style="display: none;"></canvas>
    </div>

    <script>
        window.onload = function() {
            var V86Class = window.V86 || window.V86Starter;

            if (!V86Class) {
                console.error("libv86.js failed to load.");
                return;
            }

            function getAbsUrl(filename) {
                return new URL(filename, location.href).href;
            }

            var emulator = window.emulator = new V86Class({
                wasm_path: getAbsUrl("v86.wasm"),
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: getAbsUrl("seabios.bin") },
                vga_bios: { url: getAbsUrl("vgabios.bin") },
                cdrom: { url: getAbsUrl("linux4.iso") },
                autostart: true
            });
        };
    </script>
</body>
</html>
