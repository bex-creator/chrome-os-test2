<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Desktop OS</title>
    <script src="libv86.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 10px; }

        .btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
            margin: 5px;
        }

        .btn:hover { background-color: #555; }

        /* The setup menu where you pick the file */
        #setup_menu {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            border: 2px solid #333;
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px 0;
            color: #fff;
        }

        #screen_container {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.7);
            background-color: #000;
            overflow: hidden;
            display: none; /* Hidden until you pick a file */
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #screen_container:fullscreen {
            border: none;
            border-radius: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        canvas {
            display: block;
            cursor: none; 
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>WebAssembly Desktop OS</h1>
        <p>Click inside the window to lock the mouse. Press <b>Esc</b> to release it.</p>
        <button class="btn" id="btn_fullscreen" style="display:none;">Go Fullscreen</button>
    </div>

    <!-- The new menu to select your heavy OS file from your PC -->
    <div id="setup_menu">
        <h2>Boot a Modern OS</h2>
        <p>Select an .iso file from your computer to run it locally.</p>
        <input type="file" id="os_file" accept=".iso,.img">
        <br>
        <button class="btn" id="btn_start">Boot Emulator</button>
    </div>

    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace;"></div>
        <canvas></canvas>
    </div>

    <script>
        var emulator = null;

        document.getElementById("btn_start").addEventListener("click", function() {
            var fileInput = document.getElementById("os_file");
            
            if (fileInput.files.length === 0) {
                alert("Please click 'Choose File' and select an OS image first!");
                return;
            }

            var file = fileInput.files[0];
            
            // Create a secure local URL so the emulator can read the file directly off your hard drive
            var fileUrl = URL.createObjectURL(file);

            // Hide the setup menu, show the screen and fullscreen button
            document.getElementById("setup_menu").style.display = "none";
            document.getElementById("screen_container").style.display = "flex";
            document.getElementById("btn_fullscreen").style.display = "inline-block";

            // Initialize the emulator with 1GB of RAM and the local file
            emulator = new window.V86({
                wasm_path: "v86.wasm",
                memory_size: 1024 * 1024 * 1024, // 1GB of RAM for modern systems  
                vga_memory_size: 32 * 1024 * 1024,   
                screen_container: document.getElementById("screen_container"),
                bios: {
                    url: "seabios.bin",
                },
                vga_bios: {
                    url: "vgabios.bin",
                },
                cdrom: {
                    url: fileUrl,
                    async: true,
                },
                autostart: true,
            });

            var canvas = document.querySelector("canvas");
            canvas.addEventListener("click", async function() {
                if (document.pointerLockElement !== canvas) {
                    await canvas.requestPointerLock();
                }
            });
        });

        // Fullscreen logic
        var btnFullscreen = document.getElementById("btn_fullscreen");
        var container = document.getElementById("screen_container");

        btnFullscreen.addEventListener("click", function() {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error("Error attempting to enable fullscreen mode:", err);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
