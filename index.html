<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Desktop OS</title>
    <!-- Load the local script you uploaded -->
    <script src="libv86.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        #screen_container {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.7);
            background-color: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <h1>WebAssembly Desktop OS</h1>
    <p>Click inside the window to control the mouse and keyboard.</p>

    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace;"></div>
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            // Using window.V86 (the standard command for newer v86 versions)
            var emulator = new window.V86({
                // Pointing directly to the files in your GitHub repo
                wasm_path: "v86.wasm",
                memory_size: 128 * 1024 * 1024,     
                vga_memory_size: 8 * 1024 * 1024,   
                screen_container: document.getElementById("screen_container"),
                bios: {
                    url: "seabios.bin",
                },
                vga_bios: {
                    url: "vgabios.bin",
                },
                fda: {
                    url: "kolibri.img",
                },
                autostart: true,
            });
        };
    </script>
</body>
</html>
