<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <link rel="icon" href="data:,">
    
    <!-- Load local libv86.js from repository -->
    <script src="libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            overflow: auto;
        }

        #status_bar {
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ff66;
            text-align: center;
            max-width: 640px;
            word-break: break-all;
        }

        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 4px;
        }

        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        #screen_container > div {
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            color: #ffffff;
            background-color: #000000;
        }

        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div id="status_bar">Initializing emulator environment...</div>

    <div id="screen_wrapper">
        <div id="screen_container">
            <div></div>
            <canvas></canvas>
        </div>
    </div>

    <script>
        window.onload = function() {
            var statusBar = document.getElementById("status_bar");
            var V86Class = window.V86Starter || window.V86;

            if (!V86Class) {
                statusBar.style.color = "#ff4444";
                statusBar.textContent = "Error: libv86.js failed to load.";
                return;
            }

            statusBar.textContent = "Loading Linux ISO and BIOS binaries...";

            var emulator = window.emulator = new V86Class({
                wasm_path: "v86.wasm",
                memory_size: 256 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "seabios.bin" },
                vga_bios: { url: "vgabios.bin" },
                cdrom: { url: "linux4.iso" },
                autostart: true
            });

            emulator.add_listener("emulator-ready", function() {
                statusBar.textContent = "Emulator active. Booting Linux...";
            });
        };
    </script>
</body>
</html>
