<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <link rel="icon" href="data:,">
    
    <!-- Load v86 library from jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            overflow: auto;
        }

        #status_bar {
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ff66;
            text-align: center;
            max-width: 640px;
            word-break: break-all;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 4px;
        }

        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
        }

        #screen_container div {
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            color: #ffffff;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div id="status_bar">Initializing diagnostic environment...</div>

    <div id="screen_wrapper">
        <div id="screen_container"></div>
    </div>

    <script>
        const statusBar = document.getElementById("status_bar");

        function logStatus(msg, isError = false) {
            statusBar.style.color = isError ? "#ff4444" : "#00ff66";
            statusBar.textContent = msg;
            if (isError) console.error(msg);
        }

        // Catch and display runtime JavaScript errors directly in the UI
        window.onerror = function(msg, url, line) {
            logStatus("JS Error: " + msg + " (Line " + line + ")", true);
        };
        window.onunhandledrejection = function(e) {
            logStatus("Promise Rejection: " + (e.reason ? (e.reason.message || e.reason) : e), true);
        };

        // Pre-fetch files into memory and verify file size to detect corrupt/LFS files
        async function fetchBinary(primaryUrl, fallbackUrl, minBytes = 1000) {
            logStatus("Loading " + primaryUrl + "...");
            try {
                let res = await fetch(primaryUrl);
                if (!res.ok) throw new Error("HTTP " + res.status);
                let buf = await res.arrayBuffer();
                if (buf.byteLength < minBytes) {
                    throw new Error("File too small (" + buf.byteLength + " B). Likely a Git LFS pointer.");
                }
                return buf;
            } catch (err) {
                if (fallbackUrl) {
                    logStatus(primaryUrl + " failed (" + err.message + "). Fetching CDN fallback...");
                    let res = await fetch(fallbackUrl);
                    if (!res.ok) throw new Error("CDN fallback failed HTTP " + res.status);
                    return await res.arrayBuffer();
                }
                throw err;
            }
        }

        window.onload = async function() {
            if (window.location.protocol === "file:") {
                logStatus("Error: v86 cannot run via file:// protocol. View this page via GitHub Pages or a web server.", true);
                return;
            }

            var V86Class = window.V86Starter || window.V86;
            if (!V86Class) {
                logStatus("Error: v86 runtime failed to load from CDN.", true);
                return;
            }

            try {
                const biosBuf = await fetchBinary(
                    "seabios.bin", 
                    "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin", 
                    10000
                );
                
                const vgaBiosBuf = await fetchBinary(
                    "vgabios.bin", 
                    "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin", 
                    10000
                );
                
                const isoBuf = await fetchBinary(
                    "linux4.iso", 
                    "https://cdn.jsdelivr.net/gh/copy/v86@master/images/linux4.iso", 
                    1000000
                );

                logStatus("Initializing WebAssembly Virtual Machine...");

                var emulator = window.emulator = new V86Class({
                    wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                    memory_size: 64 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    screen_container: document.getElementById("screen_container"),
                    bios: { buffer: biosBuf },
                    vga_bios: { buffer: vgaBiosBuf },
                    cdrom: { buffer: isoBuf },
                    autostart: true
                });

                emulator.add_listener("emulator-ready", function() {
                    logStatus("Emulator active. Linux is booting below...");
                });

            } catch (err) {
                logStatus("Boot Failure: " + err.message, true);
            }
        };
    </script>
</body>
</html>
