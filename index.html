<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Desktop OS</title>
    <!-- Load v86 library via CORS-friendly jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        #screen_container {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.7);
            background-color: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <h1>WebAssembly Desktop OS</h1>
    <p>Click inside the window to control the mouse and keyboard.</p>

    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace;"></div>
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            var emulator = new V86Starter({
                // Using jsDelivr CDN links to bypass CORS blocks
                wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                memory_size: 128 * 1024 * 1024,     // 128 MB RAM
                vga_memory_size: 8 * 1024 * 1024,   // 8 MB VRAM
                screen_container: document.getElementById("screen_container"),
                bios: {
                    url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin",
                },
                vga_bios: {
                    url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin",
                },
                fda: {
                    url: "https://cdn.jsdelivr.net/gh/copy/v86@master/images/kolibri.img",
                },
                autostart: true,
            });
        };
    </script>
</body>
</html>
