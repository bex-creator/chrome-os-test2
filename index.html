<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Desktop OS</title>
    <!-- Load the local script you uploaded -->
    <script src="libv86.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 10px; }

        button {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #555; }

        /* The box that holds the screen */
        #screen_container {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.7);
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* How the container behaves when Fullscreen mode is active */
        #screen_container:fullscreen {
            border: none;
            border-radius: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        /* Scales the OS to fit the screen without stretching weirdly */
        canvas {
            display: block;
            cursor: none; 
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>WebAssembly Desktop OS</h1>
        <p>Click inside the window to lock the mouse. Press <b>Esc</b> to release it.</p>
        <button id="btn_fullscreen">Go Fullscreen</button>
    </div>

    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace;"></div>
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            // Initialize the emulator using your local files
            var emulator = new window.V86({
                wasm_path: "v86.wasm",
                memory_size: 512 * 1024 * 1024,     
                vga_memory_size: 8 * 1024 * 1024,   
                screen_container: document.getElementById("screen_container"),
                bios: {
                    url: "seabios.bin",
                },
                vga_bios: {
                    url: "vgabios.bin",
                },
                hda: {
                    url: "reactos.img",
                },
                autostart: true,
            });

            var canvas = document.querySelector("canvas");
            var container = document.getElementById("screen_container");
            var btnFullscreen = document.getElementById("btn_fullscreen");

            // Lock the mouse to the canvas when clicked to fix the double cursor
            canvas.addEventListener("click", async function() {
                if (document.pointerLockElement !== canvas) {
                    await canvas.requestPointerLock();
                }
            });

            // Activate true fullscreen mode when the button is clicked
            btnFullscreen.addEventListener("click", function() {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => {
                        console.error("Error attempting to enable fullscreen mode:", err);
                    });
                } else {
                    document.exitFullscreen();
                }
            });
        };
    </script>
</body>
</html>
