<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <link rel="icon" href="data:,">
    
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            overflow: auto;
        }

        #status_bar {
            margin-bottom: 12px;
            font-size: 14px;
            color: #00ff66;
            text-align: center;
        }

        #screen_wrapper {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 4px;
        }

        /* Fixed 640x400 dimensions prevent screen collapses during text/VGA mode switches */
        #screen_container {
            width: 640px;
            height: 400px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        /* Text Mode element styling */
        #screen_container > div {
            width: 100%;
            height: 100%;
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 14px;
            color: #ffffff;
            background-color: #000000;
            overflow: hidden;
        }

        /* VGA Graphics Canvas element styling */
        #screen_container > canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <div id="status_bar">Initializing emulator environment...</div>

    <div id="screen_wrapper">
        <div id="screen_container">
            <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
            <canvas style="display: none"></canvas>
        </div>
    </div>

    <script>
        window.onload = function() {
            var statusBar = document.getElementById("status_bar");
            var V86Class = window.V86Starter || window.V86;

            if (!V86Class) {
                statusBar.style.color = "#ff4444";
                statusBar.textContent = "Error: libv86.js failed to load.";
                return;
            }

            statusBar.textContent = "Booting SeaBIOS... (Kernel decompression takes ~20s)";

            // Initialize the emulator
            var emulator = window.emulator = new V86Class({
                wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                memory_size: 512 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin" },
                vga_bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin" },
                cdrom: { url: "linux4.iso" }, // v86 resolves relative paths automatically
                autostart: true
            });

            // UI Listeners for emulator states
            emulator.add_listener("emulator-ready", function() {
                statusBar.style.color = "#00ff66";
                statusBar.textContent = "Kernel Loading - Output will render shortly...";
            });

            // Listen for missing ISOs or BIOS files
            emulator.add_listener("download-error", function(e) {
                statusBar.style.color = "#ff4444";
                statusBar.textContent = "Error loading file: " + (e || "Ensure linux4.iso is in the root folder.");
            });
        };
    </script>
</body>
</html>
