<!DOCTYPE html>
<html style="height: 100%; margin: 0; background: #000;">
<head>
    <meta charset="utf-8">
    <title>Web Linux</title>
    <!-- Prevent 404 favicon logs -->
    <link rel="icon" href="data:,">
    
    <script src="libv86.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
        }

        #screen_container {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }

        /* Set text mode styling without breaking display visibility toggles */
        #screen_container div {
            color: #ffffff !important;
            background-color: #000000 !important;
        }
    </style>
</head>
<body>

    <!-- Standard ScreenAdapter layout required by v86 -->
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <script>
        window.onload = function() {
            var V86Class = window.V86 || window.V86Starter;

            if (!V86Class) {
                console.error("libv86.js failed to load.");
                return;
            }

            function getAbsUrl(filename) {
                return new URL(filename, location.href).href;
            }

            var emulator = window.emulator = new V86Class({
                wasm_path: getAbsUrl("v86.wasm"),
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: getAbsUrl("seabios.bin") },
                vga_bios: { url: getAbsUrl("vgabios.bin") },
                cdrom: { url: getAbsUrl("linux4.iso") },
                autostart: true
            });
        };
    </script>
</body>
</html>
